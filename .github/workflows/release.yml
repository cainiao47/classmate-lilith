name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update"
        required: true
        default: "v0.21.0"

permissions:
  contents: write

env:
  NODE_VERSION: 22.23.3
  FFMPEG_VERSION: 9.0.2
  FFMPEG_COMMIT: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
  LAME_VERSION: "3.100"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Download verified Node.js and FFmpeg runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'classmate-downloads'
          $seed = Join-Path $env:RUNNER_TEMP 'classmate-runtime'
          New-Item -ItemType Directory -Force -Path $download, (Join-Path $seed 'runtime\node'), (Join-Path $seed 'runtime\ffmpeg') | Out-Null

          $nodeArchive = "node-v$env:NODE_VERSION-win-x64.zip"
          $nodeBase = "https://nodejs.org/dist/v$env:NODE_VERSION"
          Invoke-WebRequest "$nodeBase/$nodeArchive" -OutFile (Join-Path $download $nodeArchive)
          Invoke-WebRequest "$nodeBase/SHASUMS256.txt" -OutFile (Join-Path $download 'node-SHASUMS256.txt')
          $expectedNode = ((Select-String -LiteralPath (Join-Path $download 'node-SHASUMS256.txt') -Pattern "  $([regex]::Escape($nodeArchive))$").Line -split '\s+')[0]
          $actualNode = (Get-FileHash -LiteralPath (Join-Path $download $nodeArchive) -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expectedNode -or $actualNode -ne $expectedNode) { throw 'Node.js checksum verification failed.' }
          Expand-Archive -LiteralPath (Join-Path $download $nodeArchive) -DestinationPath (Join-Path $download 'node')
          Copy-Item -Path (Join-Path $download "node\node-v$env:NODE_VERSION-win-x64\*") -Destination (Join-Path $seed 'runtime\node') -Recurse -Force

          $ffmpegArchive = 'ffmpeg-release-essentials.zip'
          $ffmpegBase = 'https://www.gyan.dev/ffmpeg/builds'
          Invoke-WebRequest "$ffmpegBase/$ffmpegArchive" -OutFile (Join-Path $download $ffmpegArchive)
          Invoke-WebRequest "$ffmpegBase/$ffmpegArchive.sha256" -OutFile (Join-Path $download 'ffmpeg.sha256')
          $expectedFfmpeg = ((Get-Content -LiteralPath (Join-Path $download 'ffmpeg.sha256') -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actualFfmpeg = (Get-FileHash -LiteralPath (Join-Path $download $ffmpegArchive) -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expectedFfmpeg -or $actualFfmpeg -ne $expectedFfmpeg) { throw 'FFmpeg checksum verification failed.' }
          Expand-Archive -LiteralPath (Join-Path $download $ffmpegArchive) -DestinationPath (Join-Path $download 'ffmpeg')
          $ffmpegExe = Get-ChildItem -LiteralPath (Join-Path $download 'ffmpeg') -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) { throw 'FFmpeg executable was not found in the verified archive.' }
          Copy-Item -LiteralPath $ffmpegExe.FullName -Destination (Join-Path $seed 'runtime\ffmpeg\ffmpeg.exe')
      - name: Build Windows portable package
        shell: pwsh
        run: .\distribution\build-windows-base.ps1 -RuntimeSeed (Join-Path $env:RUNNER_TEMP 'classmate-runtime')
      - name: Write Windows archive checksum
        shell: pwsh
        run: |
          $archive = 'dist\Classmate-Lilith-Windows-x64.zip'
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Classmate-Lilith-Windows-x64.zip" | Set-Content -LiteralPath 'dist\Classmate-Lilith-Windows-x64.sha256' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Classmate-Lilith-Windows-x64.zip
            dist/Classmate-Lilith-Windows-x64.sha256
          if-no-files-found: error

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build static Apple Silicon FFmpeg with LAME
        shell: bash
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/classmate-downloads"
          prefix="$RUNNER_TEMP/classmate-runtime"
          mkdir -p "$download" "$prefix"

          node_archive="node-v${NODE_VERSION}-darwin-arm64.tar.xz"
          node_base="https://nodejs.org/dist/v${NODE_VERSION}"
          curl --fail --location --retry 3 "$node_base/$node_archive" -o "$download/$node_archive"
          curl --fail --location --retry 3 "$node_base/SHASUMS256.txt" -o "$download/node-SHASUMS256.txt"
          (cd "$download" && grep "  $node_archive$" node-SHASUMS256.txt | shasum -a 256 -c -)
          tar -xJf "$download/$node_archive" -C "$download"

          lame_archive="lame-${LAME_VERSION}.tar.gz"
          curl --fail --location --retry 3 "https://downloads.sourceforge.net/project/lame/lame/${LAME_VERSION}/$lame_archive" -o "$download/$lame_archive"
          echo "ddfe36cab873794038ae2c1210557ad34857a4b6bdc515785d1da9e175b1da1e  $download/$lame_archive" | shasum -a 256 -c -
          tar -xzf "$download/$lame_archive" -C "$download"
          (
            cd "$download/lame-${LAME_VERSION}"
            ./configure --prefix="$prefix" --disable-shared --enable-static --disable-frontend CFLAGS="-arch arm64 -mmacosx-version-min=13.0"
            make -j"$(sysctl -n hw.ncpu)"
            make install
          )

          git clone --branch "n${FFMPEG_VERSION}" --depth 1 https://github.com/FFmpeg/FFmpeg.git "$download/ffmpeg-${FFMPEG_VERSION}"
          test "$(git -C "$download/ffmpeg-${FFMPEG_VERSION}" rev-parse HEAD)" = "$FFMPEG_COMMIT"
          (
            cd "$download/ffmpeg-${FFMPEG_VERSION}"
            export PKG_CONFIG_PATH="$prefix/lib/pkgconfig"
            ./configure \
              --prefix="$prefix" \
              --arch=arm64 \
              --target-os=darwin \
              --cc=clang \
              --extra-cflags="-arch arm64 -mmacosx-version-min=13.0 -I$prefix/include" \
              --extra-ldflags="-arch arm64 -mmacosx-version-min=13.0 -L$prefix/lib" \
              --pkg-config-flags=--static \
              --disable-autodetect \
              --enable-static \
              --disable-shared \
              --enable-gpl \
              --enable-libmp3lame \
              --disable-doc \
              --disable-debug \
              --disable-ffplay \
              --disable-ffprobe
            make -j"$(sysctl -n hw.ncpu)"
            make install
          )

          bash distribution/build-macos-arm64.sh \
            --node-bin "$download/node-v${NODE_VERSION}-darwin-arm64/bin/node" \
            --ffmpeg "$prefix/bin/ffmpeg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/Classmate-Lilith-macOS-arm64.zip
            dist/Classmate-Lilith-macOS-arm64.sha256
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Classmate Lilith ${TAG#v}" \
            --generate-notes \
            --target "$GITHUB_SHA"

